[project]
name = "yue-backend"
version = "0.1.0"
description = "Backend for Yue - AI Powered Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-ai-slim[openai,google]==2.37.0",
    "python-dotenv",
    "httpx",
    "httpx2",
    "h2",
    "certifi",
    "mcp",
    "logfire",
    "fastmcp",
    "pypdf",
    "python-docx",
    "markdown",
    "weasyprint",
    "pymupdf",
    "pdfminer.six",
    "pdfplumber",
    "python-pptx",
    "psutil",
    "openpyxl",
    "duckdb",
    "pandas",
    "sqlalchemy>=2.0.48",
    "alembic>=1.18.4",
    "python-json-logger",
    "pyyaml",
    "sqlite-vec",
    "session-context-manager @ git+https://github.com/cute-spring/session-context-manager.git@fcc07a62f23df1060b50d6ef499756f1b4eee13f",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
